# Stack production. Chạy trên VPS bằng:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# File này TỰ CHỨA, không chồng lên docker-compose.yml. Lý do: prod khác dev ở
# đúng những chỗ mà cơ chế merge của compose xử lý im lặng và dễ sai — `ports`
# được nối thêm chứ không thay thế, `extra_hosts` không gỡ được. Một cổng dev
# lỡ bind 0.0.0.0 còn sót lại trên máy có IP công cộng là một sự cố bảo mật,
# nên ở đây khai báo tường minh thay vì suy ra từ file khác.
#
# VPS không có source code. Chỉ cần file này, Caddyfile, backup.sh và .env.
#
# Mỗi image có tag riêng trong .env: API_TAG do biibo-backend ghi, WEB_TAG do
# biibo-vocabulary ghi. Thiếu thì rơi về IMAGE_TAG (biến chung của thời một repo),
# rồi mới tới :latest.

# Docker giữ log của mỗi container trong một file json không có giới hạn: để lâu
# là đầy đĩa và mọi service cùng chết. Mỗi service giữ tối đa 3 × 20MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ── Biên mạng ───────────────────────────────────────────────────────────
  # Chỉ duy nhất service này mở cổng ra internet. Mọi thứ khác nói chuyện qua
  # mạng nội bộ của compose.
  caddy:
    image: caddy:2-alpine
    container_name: biibo-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    # PHẢI là env_file, KHÔNG được là `environment:`. Hash bcrypt chứa ký tự `$`
    # (`$2a$14$...`), mà compose diễn giải `$` trong `environment:` như biến và
    # nuốt mất từng đoạn — hash 60 ký tự tới nơi chỉ còn 49, và Caddy trả 401
    # cho cả mật khẩu đúng. `env_file` truyền nguyên văn, không diễn giải.
    #
    # File riêng chứ không dùng chung `.env`: Caddy không có việc gì phải biết
    # mật khẩu Postgres.
    env_file:
      - ./caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin

  # ── Ứng dụng ────────────────────────────────────────────────────────────
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/nguyenmanh18}/biibo-web:${WEB_TAG:-${IMAGE_TAG:-latest}}
    container_name: biibo-web
    restart: unless-stopped
    logging: *logging
    # Không publish cổng: Caddy vào được qua mạng nội bộ.
    environment:
      # NEXT_PUBLIC_* KHÔNG có ở đây — chúng đã bị nướng vào image lúc build.
      # Xem phần đầu Dockerfile.
      BACKEND_INTERNAL_URL: http://api:8080
      # Không mang tiền tố NEXT_PUBLIC_, nên Next đọc lúc chạy chứ không nướng
      # vào bundle: đổi trong .env rồi `up -d` là đủ.
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    depends_on:
      api:
        condition: service_healthy

  # Admin dùng chung ecosystem (English hôm nay, Trung sắp tới), nên đứng riêng
  # repo/image với web — không phải một route trong web nữa. Xem
  # biibo-supper-admin/AGENTS.md.
  admin:
    image: ${IMAGE_PREFIX:-ghcr.io/nguyenmanh18}/biibo-admin:${ADMIN_TAG:-${IMAGE_TAG:-latest}}
    container_name: biibo-admin
    restart: unless-stopped
    logging: *logging
    # Không publish cổng: Caddy vào được qua mạng nội bộ.
    environment:
      # NEXT_PUBLIC_* KHÔNG có ở đây — chúng đã bị nướng vào image lúc build.
      BACKEND_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/nguyenmanh18}/biibo-api:${API_TAG:-${IMAGE_TAG:-latest}}
    container_name: biibo-api
    restart: unless-stopped
    logging: *logging
    # Toàn bộ khoá bí mật (Google, Zalo, SMTP, Sepay, Polar, R2, AI) đọc từ .env
    # trên VPS. File đó không bao giờ nằm trong repo hay trong image.
    env_file:
      - .env
    environment:
      # Ba biến này phải trỏ vào tên service nội bộ, nên chúng ghi đè .env —
      # `environment` thắng `env_file` trong compose.
      DATABASE_URL: postgres://biibo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chua duoc dat trong .env}@postgres:5432/biibo_english?sslmode=disable&pool_max_conns=40
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD chua duoc dat trong .env}@redis:6379/0
      RESTATE_INGRESS_URL: http://restate:8080
      RESTATE_HANDLER_ADDR: 0.0.0.0:9080
      SESSION_COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # Chạy migration rồi thoát. `profiles` giữ nó ngoài `up -d`; deploy gọi riêng:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/nguyenmanh18}/biibo-api:${API_TAG:-${IMAGE_TAG:-latest}}
    profiles: ["tools"]
    command:
      - goose
      - -dir
      - db/migrations
      - postgres
      - postgres://biibo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chua duoc dat trong .env}@postgres:5432/biibo_english?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  # ── Hạ tầng ─────────────────────────────────────────────────────────────
  # Không service nào dưới đây publish cổng ra host. Nhớ: Docker publish cổng
  # bằng luật NAT đi vòng qua UFW, nên `ufw deny` KHÔNG đóng được một cổng đã
  # publish — cách chắc chắn duy nhất là không publish.
  postgres:
    image: postgres:16-alpine
    container_name: biibo-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: biibo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chua duoc dat trong .env}
      POSTGRES_DB: biibo_english
    ports:
      # CHỈ loopback. Nhờ vậy DataGrip/psql ở máy cá nhân vào được qua đường hầm
      # SSH (`ssh -L 5433:127.0.0.1:5432 biibo`) mà cổng vẫn không hề tồn tại
      # đối với internet. Dấu `127.0.0.1:` ở đầu là toàn bộ phần bảo mật của
      # dòng này — bỏ nó đi là mở database ra cả thế giới, và UFW sẽ KHÔNG cứu
      # được vì Docker publish cổng bằng luật NAT đi vòng qua UFW.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biibo -d biibo_english"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: biibo-redis
    restart: unless-stopped
    logging: *logging
    # Dev chạy Redis không mật khẩu; trên máy có IP công cộng thì đó là lỗ hổng
    # nặng nhất trong danh sách (ai cũng FLUSHALL được). Bắt buộc có mật khẩu.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD chua duoc dat trong .env}", "--appendonly", "yes"]
    ports:
      # Chỉ loopback, xem ghi chú ở postgres bên trên.
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  restate:
    # GHIM BẢN. `:latest` nghĩa là một lần `compose pull` bất kỳ có thể kéo về
    # bản major mới rồi restart im lặng — Restate giữ journal RocksDB trên đĩa,
    # nên một bản nhảy cóc có thể nâng cấp định dạng state một chiều. Muốn lên
    # bản mới: đọc release notes, đổi số ở đây, deploy như mọi thay đổi khác.
    image: docker.restate.dev/restatedev/restate:1.7.9
    container_name: biibo-restate
    restart: unless-stopped
    logging: *logging
    # ĐỪNG BỎ DÒNG NÀY. Restate lấy tên node từ hostname, mà Docker đặt hostname
    # bằng container ID — mỗi lần container bị tạo lại là một tên node mới, và
    # nó từ chối khởi động trên dữ liệu của tên cũ ("node-name is required").
    # Một cái tên cố định làm cho việc tạo lại container trở thành chuyện thường.
    environment:
      RESTATE_NODE_NAME: biibo-restate
    ports:
      # Ingress 8080 KHÔNG publish: chỉ `api` gọi vào, qua mạng nội bộ. Đây là
      # "cổng tốn tiền" — ai gọi được /Scoring/ScoreSentence là đốt tiền Azure.
      #
      # 9070 là UI/admin, bind 127.0.0.1 nên chỉ tới được qua SSH:
      #   ssh -L 9070:127.0.0.1:9070 user@vps   rồi mở http://localhost:9070
      # Restate self-host không có lớp đăng nhập cho cổng này, nên xác thực ở
      # đây chính là SSH key. TUYỆT ĐỐI không đổi thành 0.0.0.0.
      - "127.0.0.1:9070:9070"
    volumes:
      # Kho state thứ hai của hệ thống (journal RocksDB) — phải backup như
      # Postgres, mất là mất job đang chạy dở.
      - restatedata:/restate-data

  # Dựng sẵn cho ngày tách DB ra máy riêng / chạy nhiều instance. CHƯA nối vào
  # ứng dụng vì pgx cache prepared statement, xung đột với transaction pooling —
  # đọc cảnh báo trong docs/infrastructure.md trước khi trỏ DATABASE_URL vào đây.
  # `profiles` giữ nó không chạy, để không tốn RAM cho thứ chưa dùng.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: biibo-pgbouncer
    profiles: ["future"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: biibo
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: biibo_english
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25

volumes:
  pgdata:
  redisdata:
  restatedata:
  caddy_data:
  caddy_config:
